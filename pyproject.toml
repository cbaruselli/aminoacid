[build-system] 
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aminoacid"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
description = "A game to learn amino acids"
dependencies = [
    # "rdkit",
]
authors = [
    {name = "Naomi", email = "naomi.pantillon@epfl.ch"}, 
    {name = "Chloé", email = "chloe.baruselli@epfl.ch}, 
    {name = "Cléa", email = "clea.pernet@epfl.ch"}, 
    {name = "Monica", email = "monica.minazzo@epfl.ch}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dynamic = ["version"]

[project.urls]
source = "https://github.com/NaomiPant/aminoacid"
tracker = "https://github.com/NaomiPant/aminoacid/issues"

[project.optional-dependencies]
test = [
    "hypothesis",
    "pytest",
    "pytest-cov",
    "tox",
    "genbadge[coverage]",
]
doc = [
    "furo",
    "myst-parser",
    "sphinx>=5",
    "sphinx-copybutton",
]

[tool.hatch.version]
path = "src/aminoacid/__init__.py"

[tool.pytest.ini_options]
testpaths = [
    "tests",
]

[tool.coverage.run]
omit = [
    '__init__.py'
]

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
]
